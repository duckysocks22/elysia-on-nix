on:
  schedule:
    - cron: '0 0 * * *'
  push:
  workflow_dispatch:

jobs:
  update-elysia:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        run: |
          apt update
          apt install -y curl
          curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | \
          sh -s -- install --no-confirm --extra-conf "trusted-users = $(whoami)" "experimental-features = nix-command flakes"
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh

      - name: Get Latest Version from Source
        id: get_version
        run: |
          apt install -y jq
          LATEST_TAG=$(curl -s https://dawn.wine/api/v1/repos/elysia/elysia/releases/latest | jq -r .tag_name)
          VERSION=${LATEST_TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Update Nix File and Hash
        run: |
          # 1. Get the new version and hash
          NEW_VERSION="${{ steps.get_version.outputs.VERSION }}"
          # Fetch the new SRI hash from the source URL
          NEW_HASH=$(nix-prefetch-url https://dawn.wine/elysia/elysia.git)
          NEW_SRI_HASH=$(nix hash to-sri --type sha256 $NEW_HASH)

          echo "Updating to $NEW_VERSION with hash $NEW_SRI_HASH"

          # 2. Use sed to swap the values in your file
          # Replace 'version = "...";' and 'hash = "...";'
          sed -i "s/version = \".*\";/version = \"$NEW_VERSION\";/" ./modules/elysia.nix
          sed -i "s|hash = \".*\";|hash = \"$NEW_SRI_HASH\";|" ./modules/elysia.nix
          
          # 3. Update the lockfile just in case
          nix flake update

      - name: Verify Build
        run: nix build -L .

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          NEW_VER="${{ steps.update_version.outputs.NEW_VERSION }}"
          BRANCH_NAME="update-elysia-v$NEW_VER"
          
          git config user.name "nix-bot"
          git config user.email "bot@puppygirls.net"
          
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "chore: bump elysia to $NEW_VER"
          git push origin "$BRANCH_NAME"

          # Forgejo and GitHub CLI (gh) can often be used to open PRs
          gh pr create --title "Bump Elysia to $NEW_VER" --body "Automated version bump and build verification." --head "$BRANCH_NAME" --base dev