on:
  push:
    branches:
      - dev
      
jobs:
  build:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Nix
        uses: determinatesystems/nix-installer-action@main
        with:
          extra-conf: |
            trusted-users = runner
            experimental-features = nix-command flakes
  
    - name: Build Elysia
      run: nix build .#elysia