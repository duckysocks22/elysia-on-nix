on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
        apt update
        apt install -y curl
        curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | \
        sh -s -- install --no-confirm --extra-conf "trusted-users = $(whoami)"
        ls -la
        
